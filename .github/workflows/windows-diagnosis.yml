name: Windows startup diagnosis
on:
  push:
    paths: ['.github/workflows/windows-diagnosis.yml']
permissions:
  actions: read
  contents: read
jobs:
  diagnose:
    runs-on: windows-latest
    steps:
      - name: Download existing Alpha 2 executable
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json" }
          Invoke-WebRequest -Uri 'https://api.github.com/repos/usvictor/SplitGui/actions/artifacts/12432010011/zip' -Headers $headers -OutFile artifact.zip
          Expand-Archive artifact.zip artifact
          Expand-Archive artifact/TailscaleSplitGUI-v2-Windows-x64.zip app
          $p = Start-Process app/TailscaleSplitGUI.exe -PassThru -RedirectStandardError stderr.txt -RedirectStandardOutput stdout.txt
          Start-Sleep -Seconds 8
          $p.Refresh()
          Get-Content stderr.txt -Encoding utf8
          Get-Content stdout.txt -Encoding utf8
          Write-Output "Exited=$($p.HasExited)"
          if (-not $p.HasExited) { $p.CloseMainWindow() | Out-Null }
